<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Dương</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calendar">
    <!-- Thanh tiêu đề: nút lùi tháng, tên tháng/năm, nút tới tháng -->
    <header class="calendar-header">
      <button id="prev" aria-label="Tháng trước">&#8249;</button>
      <h1 id="month-year"></h1>
      <button id="next" aria-label="Tháng sau">&#8250;</button>
    </header>

    <!-- Tên các ngày trong tuần (bắt đầu từ Thứ Hai) -->
    <div class="weekdays">
      <div>T2</div><div>T3</div><div>T4</div><div>T5</div>
      <div>T6</div><div>T7</div><div>CN</div>
    </div>

    <!-- Các ô ngày sẽ được JavaScript tạo ra ở đây -->
    <div id="days" class="days"></div>

    <button id="today" class="today-btn">Hôm nay</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
